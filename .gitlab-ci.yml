stages:
  - mirror

mirror_to_github:
  stage: mirror
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  script:
    - git remote add github https://oauth2:${GITHUB_TOKEN}@github.com/AliAkbarBaloch/Student-Assistant-Deutsch-Sprache.git
    - git push github HEAD:main
  only:
    - main